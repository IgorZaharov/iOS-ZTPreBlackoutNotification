name: iOS-ZTPreBlackoutNotification
options:
  bundleIdPrefix: ua.blackout
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.3.5"
    CURRENT_PROJECT_VERSION: "105"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  ZTPreBlackout:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
      - path: ZTPreBlackout
      - path: ZTPreBlackout/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.blackout.prewarning
        INFOPLIST_FILE: ZTPreBlackout/Info.plist
        CODE_SIGN_ENTITLEMENTS: ZTPreBlackout/ZTPreBlackout.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: BlackoutWidgetExtension
        embed: true

  BlackoutWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
      - path: BlackoutWidgetExtension
      - path: BlackoutWidgetExtension/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/valid-urls.json
        buildPhase: resources
      - path: Resources/donations.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.blackout.prewarning.widget
        INFOPLIST_FILE: BlackoutWidgetExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: BlackoutWidgetExtension/BlackoutWidgetExtension.entitlements

  ZTPreBlackoutTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ZTPreBlackoutTests
    dependencies:
      - target: ZTPreBlackout
